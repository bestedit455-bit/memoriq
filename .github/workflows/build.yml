name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and add app code
        run: |
          cp main.dart /tmp/main.dart
          flutter create --org com.meri --project-name memoriq --platforms=android .
          cp /tmp/main.dart lib/main.dart
          cp *.dart lib/
          rm -rf test
          flutter pub add photo_manager photo_manager_image_provider video_player
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="MEMORIQ"|' $M
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: memoriq-apk
          path: build/app/outputs/flutter-apk/app-release.apk
